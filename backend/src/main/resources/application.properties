quarkus.application.name=logistix-api
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Logistix REST API
quarkus.smallrye-openapi.info-version=2.0.0
quarkus.smallrye-openapi.info-description=Educational freight routes and bookings service.
quarkus.package.jar.type=uber-jar
